---
name: Tag

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *" # 1st of every month at midnight

permissions:
  contents: write

concurrency:
  group: tag
  cancel-in-progress: false

jobs:
  tag:
    name: Create tag
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create tag
        shell: bash
        run: |
          set -Eeuo pipefail

          tag="v$(date -u +'%Y.%m.%d')"
          ref="repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}"

          if gh api "$ref" >/dev/null 2>&1; then
            echo "Tag $tag already exists"
            exit 0
          fi

          echo "Creating tag $tag at $GITHUB_SHA"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${tag}" \
            -f "sha=${GITHUB_SHA}"
